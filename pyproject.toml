[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse1999-agent"
version = "0.1.0"
description = "A local, vision-driven agent for Reverse: 1999 running in MuMu Player."
requires-python = ">=3.11"
dependencies = [
  "openai>=1.60",
  "opencv-python>=4.10",
  "Pillow>=10.4",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "tenacity>=9.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.4"]
dev = ["pytest>=8.3"]

[project.scripts]
r1999-agent = "reverse1999_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reverse1999_agent = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
